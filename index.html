<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EXPLORER'S NOTEBOOK</title>
    <link href="theexplorersnotebook.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
    <style>
        /* Full-Screen Slideshow */
        .slideshow-container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .carousel {
            width: 100%;
            height: 100%;
        }

        .carousel-inner .item img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        /* Navigation Bar */
        .topmost-contents {
            display: flex;
            gap: 50px;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: cursive;
            z-index: 10;
        }

        #inhome, #innews, #inprojects, #inaboutus {
            text-decoration: none;
            color: aquamarine;
            font-size: 18px;
            font-weight: bold;
        }

        /* Welcome Message */
        #welcoming {
            font-family: cursive;
            color: white;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
        }

        /* Content After Slideshow */
        .content {
            position: relative;
            background: white;
            padding: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Slideshow Background -->
    <div class="slideshow-container">
        <div id="myCarousel" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicators">
               <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
               <li data-target="#myCarousel" data-slide-to="1"></li>
               <li data-target="#myCarousel" data-slide-to="2"></li>
               <li data-target="#myCarousel" data-slide-to="3"></li>
               <li data-target="#myCarousel" data-slide-to="4"></li>
            </ol>

            <div class="carousel-inner">
                
                <div class="item active">
                    <img src="Screenshot 2025-03-01 230636.png" alt="Image 2">
                </div>
                <div class="item">
                    <img src="Screenshot 2025-03-01 224305.png" alt="Image 3">
                </div>
                <div class="item">
                    <img src="Screenshot 2025-03-01 230755.png" alt="Image 4">
                </div>
                <div class="item">
                    <img src="Screenshot 2025-01-30 192452.png" alt="Image 5">
                </div>
            </div>

            <!-- Controls -->
            <a class="left carousel-control" href="#myCarousel" data-slide="prev">
                <span class="glyphicon glyphicon-chevron-left"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="right carousel-control" href="#myCarousel" data-slide="next">
                <span class="glyphicon glyphicon-chevron-right"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>

        <!-- Welcome Message -->
        <h1 id="welcoming">WELCOME TO THE EXPLORER'S NOTEBOOK!</h1>
    </div>

    <!-- Navigation -->
    <div class="topmost-contents">
        <p id="home"><a id="inhome" href="index.html">HOME</a></p>
        <p id="news"><a id="innews" href="newspage.html">NEWS</a></p>
        <p id="projects"><a id="inprojects" href="projectspage.html">PROJECTS</a></p>
        <p id="aboutus"><a id="inaboutus" href="aboutuspage.html">ABOUT US</a></p>
    </div>

    <!-- Content Below Slideshow -->
    <div class="content">
        <h2>THE EXPLORER'S NOTEBOOK</h2>
        <p>Welcome to The Explorer's Notebook, where we document our journey through astronomy, technology, and creativity.</p>
        <p>Explore our latest projects, news, and discoveries.</p>
    </div>
    
</body>
</html>
